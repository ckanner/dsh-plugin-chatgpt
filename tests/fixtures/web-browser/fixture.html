<!doctype html><meta charset="utf-8"><title>Owned ChatGPT UI fixture</title>
<style>body{font:14px sans-serif;margin:20px}button{margin:4px}textarea{width:800px;height:60px}.modal{position:fixed;inset:100px 20%;background:white;border:2px solid;padding:20px;z-index:10}[hidden]{display:none!important}[data-message-content]{white-space:pre-wrap}article{border:1px solid #ddd;padding:8px}</style>
<aside data-testid="sidebar"><button id="new-project">New project</button></aside>
<header><button data-testid="accounts-profile-button">Account</button><button data-testid="model-switcher-dropdown-button" aria-expanded="false">GPT-6 Pro</button><span id="breadcrumb"></span><button data-testid="project-menu-button" hidden>Project menu</button><button id="share" hidden>Share project</button></header>
<main data-testid="project-page"><h1 data-testid="project-title"></h1><span data-testid="project-sources-count">0</span><div id="chat-list"></div><div id="messages"></div></main>
<form data-chatgpt-composer><div id="attachments"></div><input type="file" multiple accept="image/*"><textarea id="prompt-textarea"></textarea><button type="submit" data-testid="send-button">Send</button><span id="mode"></span></form>
<div id="overlay"></div>
<script>
const saved=JSON.parse(sessionStorage.getItem('fixture-state')||'null');
window.fixture=Object.assign({email:'owner@example.test',model:'GPT-6',effort:'Pro',projects:[],currentProject:null,messages:[],uploads:[],answerMode:'text',responseFinished:true,settingsMode:'project-only',sharingMode:'private',projectSources:0,extraChat:false,accountAfterUpload:null,autoRespond:true,resetModelOnProject:false},saved||{});
const f=window.fixture,overlay=document.querySelector('#overlay'),form=document.querySelector('form'),text=document.querySelector('#prompt-textarea');
function persist(){sessionStorage.setItem('fixture-state',JSON.stringify(f))}
function removeOverlay(){overlay.replaceChildren();document.querySelector('[data-testid="model-switcher-dropdown-button"]').setAttribute('aria-expanded','false')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!overlay.children.length){f.strayEscapes=(f.strayEscapes||0)+1;persist()}removeOverlay()}});
async function action(kind,data={}){const res=await fetch('/__action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,...data})});if(!res.ok)throw Error('fixture action rejected');return res.json()}
function el(tag,attrs={},content){const n=document.createElement(tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(content!==undefined)n.textContent=content;return n}
function modal(role='dialog'){removeOverlay();const n=el('div',{role,class:'modal'});overlay.append(n);return n}
function render(){
 document.querySelector('[data-testid="model-switcher-dropdown-button"]').textContent=f.model+' '+f.effort;
 document.querySelector('[data-testid="project-title"]').textContent=f.currentProject?.title||'';
 document.querySelector('#breadcrumb').replaceChildren();
 if(f.currentProject){document.querySelector('#breadcrumb').append(el('a',{href:f.currentProject.url},f.currentProject.title))}
 document.querySelector('[data-testid="project-menu-button"]').hidden=!f.currentProject;document.querySelector('#share').hidden=!f.currentProject;
 document.querySelector('[data-testid="project-sources-count"]').textContent=String(f.projectSources);
 document.querySelector('#chat-list').replaceChildren();
 for(const url of [f.currentProject?.chat,...(f.extraChat?['/c/unowned']:[])].filter(Boolean)){document.querySelector('#chat-list').append(el('a',{href:url},'Conversation'))}
 const root=document.querySelector('#messages');root.replaceChildren();
 for(const m of f.messages){const article=el('article',{'data-testid':'conversation-turn-'+m.id});const body=el('div',{'data-message-author-role':m.role,'data-message-id':m.id});body.append(el('div',{'data-message-content':''},m.text));for(const name of m.attachments||[])body.append(el('span',{'data-filename':name},name));article.append(body);if(m.role==='assistant'&&m.finished)article.append(el('button',{'data-testid':'copy-turn-action-button'},'Copy'));if(m.busy)article.append(el('span',{'data-is-streaming':'true'},'Thinking'));root.append(article)}
 const uploadRoot=document.querySelector('#attachments');uploadRoot.replaceChildren();for(const name of f.uploads)uploadRoot.append(el('div',{'data-testid':'file-upload','data-filename':f.uploadEvidenceMismatch?'unknown.png':name,'data-upload-status':f.uploadNoCompletion?'processing':'complete'},f.uploadEvidenceMismatch?'unknown.png':name));
 document.querySelector('#mode').replaceChildren();if(f.hostedTools)document.querySelector('#mode').append(el('button',{'data-testid':'agent-mode','aria-pressed':'true'},'Agent'));
 persist();
}
window.renderFixture=render;
document.querySelector('[data-testid="accounts-profile-button"]').onclick=()=>{const m=modal('menu');m.dataset.testid='account-menu';m.append(el('span',{},f.email),el('button',{role:'menuitem'},'Log out'))};
document.querySelector('[data-testid="model-switcher-dropdown-button"]').onclick=()=>{
 if(f.accountOnModelInspect){f.email=f.accountOnModelInspect;render()}
 const m=modal('menu');document.querySelector('[data-testid="model-switcher-dropdown-button"]').setAttribute('aria-expanded','true');
 for(const model of ['GPT-6','GPT-5']){const b=el('button',{role:'menuitemradio','aria-checked':String(f.model===model)},model);if(f.modelConflict&&model===f.model)b.setAttribute('data-state','unchecked');b.onclick=async()=>{await action('model',{model});f.model=model;render();removeOverlay()};m.append(b)}
 if(f.effortSlider){
  const wrap=el('div',{'data-reasoning-slider':''});const slider=el('div',{role:'slider',tabindex:'0','aria-valuemin':'0','aria-valuemax':'2','aria-valuenow':f.effort==='Pro'?'2':'1','aria-valuetext':f.effort},f.effort);
  slider.onkeydown=async e=>{if(e.key!=='ArrowRight')return;await action('effort',{effort:'Pro'});f.effort='Pro';slider.setAttribute('aria-valuenow','2');slider.setAttribute('aria-valuetext','Pro');slider.textContent='Pro';render()};wrap.append(slider);m.append(wrap)
 }else for(const effort of ['Pro','High']){const b=el('button',{role:'menuitemradio','aria-checked':String(f.effort===effort)},effort);b.onclick=async()=>{await action('effort',{effort});f.effort=effort;render();removeOverlay()};m.append(b)}
};
document.querySelector('#new-project').onclick=()=>{const m=modal();m.append(el('input',{type:'text'}));let selected='default';const p=el('button',{role:'radio','aria-checked':'false'},'Project-only'),d=el('button',{role:'radio','aria-checked':'true'},'Default');p.onclick=()=>{selected='project-only';p.setAttribute('aria-checked','true');d.setAttribute('aria-checked','false')};m.append(p,d);const create=el('button',{},'Create project');create.onclick=async()=>{const title=m.querySelector('input').value;const {id}=await action('create',{title,memory:selected});const project={id,title,url:'/g/g-p-'+id+'/project'};f.projects.push(project);f.currentProject=project;f.messages=[];f.uploads=[];if(f.resetModelOnProject){f.model='GPT-5';f.effort='High'}history.pushState(null,'',project.url);removeOverlay();text.value='';render()};m.append(create)};
document.querySelector('[data-testid="project-menu-button"]').onclick=()=>{const m=modal('menu');const b=el('button',{role:'menuitem'},'Project settings');b.onclick=()=>{const d=modal();if(f.settingsMode==='contradictory'){d.append(el('div',{'data-testid':'project-memory-mode'},'Project-only'),el('button',{role:'radio','aria-checked':'false'},'Project-only'),el('button',{role:'radio','aria-checked':'true'},'Default'))}else d.append(el('div',{'data-testid':'project-memory-mode'},f.settingsMode==='project-only'?'Project-only':'Default'));d.append(el('textarea',{name:'instructions'},f.instructions||''))};m.append(b)};
document.querySelector('#share').onclick=()=>{const d=modal();d.append(el('div',{'data-testid':'project-sharing-mode'},f.sharingMode==='private'?'Only you':'Anyone with link'));if(f.sharingMode==='contradictory')d.append(el('button',{role:'radio','aria-checked':'false'},'Only you'),el('button',{role:'radio','aria-checked':'true'},'Anyone with link'));if(f.collaborator)d.append(el('div',{'data-testid':'project-member','data-role':'member'},'Another person'))};
document.querySelector('input[type=file]').onchange=async e=>{for(const file of e.target.files){await action('upload',{name:file.name,size:file.size,mimeType:file.type});f.uploads.push(file.name)}if(f.accountAfterUpload)f.email=f.accountAfterUpload;render()};
window.finishFixture=()=>{const last=f.messages.findLast(m=>m.role==='user');if(!last)return;const request=JSON.parse(last.text);let blocks=f.answerMode==='tool'?[{type:'tool-call',id:'call1',name:'read_file',arguments:JSON.stringify({path:'README.md'})}]:[{type:'text',text:'Fixture answer'}];let answer=JSON.stringify({version:1,requestId:request.requestId,complete:true,blocks});if(f.answerMode==='wrong-request')answer=JSON.stringify({version:1,requestId:'other-turn',complete:true,blocks});if(f.answerMode==='prose')answer='Here is my answer '+answer;f.messages.push({id:'assistant-'+f.messages.length,role:'assistant',text:answer,finished:f.responseFinished,busy:!f.responseFinished});render()};
form.onsubmit=async e=>{e.preventDefault();const prompt=text.value;const result=await action('send',{prompt,uploads:f.uploads});if(!f.currentProject)throw Error('send without project');f.currentProject.chat='/c/'+f.currentProject.id;history.pushState(null,'',f.currentProject.chat);f.messages.push({id:'user-'+result.id,role:'user',text:prompt,attachments:[...f.uploads]});f.uploads=[];text.value='';if(f.autoRespond)window.finishFixture();render()};
if(f.currentProject){const requested=location.pathname;if(requested!==f.currentProject.url&&requested!==f.currentProject.chat){const found=f.projects.find(p=>p.url===requested||p.chat===requested);if(found){f.currentProject=found;f.messages=[]}}}
render();
</script>

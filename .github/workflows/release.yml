# Publishing is a release, not a side effect of a push.
#
# One tag does both halves of a release, so the registry and this repository's
# Releases page cannot drift apart again: the run publishes only when the version
# is new, and always records the GitHub Release. Pushing a tag for a version that
# is already on the registry therefore backfills its Release instead of failing,
# which is how the releases skipped while publishing by hand get recorded.
#
# Two ways in for the publish half, and the workflow does not care which one the
# maintainer chose: a repository `NPM_TOKEN` secret, or npm trusted publishing,
# where npm exchanges this run's OIDC identity for a short-lived credential and no
# long-lived token exists to leak. The Release half needs neither — it uses the
# run's own GITHUB_TOKEN, which is why `contents` is write below.
#
# Every check the CI lane runs has to pass here too, because an artifact that is
# already on the registry cannot be unpublished into a fix.
name: release

on:
  push:
    tags: ['v*']
  # Releasing the manifest's version by hand, creating the tag when it is absent.
  workflow_dispatch:

permissions:
  # Creating the GitHub Release, and attaching the packed tarball to it.
  contents: write
  # Trusted publishing: npm accepts this run's OIDC identity in place of a token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Empty when the secret is absent, which is what selects the second step.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 is the lowest the plugin supports, so the artifact is built
          # and published by the oldest runtime it claims to work on.
          node-version: '22.x'
          registry-url: https://registry.npmjs.org

      - run: npm install --ignore-scripts

      - name: Checkout pinned DSH contract sources
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d743267388641bc76f17c45ce8b4c231aed1d32c
          path: .harness-contract
          persist-credentials: false
          sparse-checkout: |
            packages/llm/llm/src
            packages/util/brand/src
            packages/util/values/src
            packages/util/crypto/src

      - name: Unit tests
        run: npm test
      - name: Real DSH stream and replay contract
        run: npm run verify:harness -- .harness-contract
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Browser bundle honours the loader contract
        run: npm run verify:client
      - name: Published package would load
        run: npm run verify:package
      - name: README pair is aligned
        run: npm run check:i18n

      - name: Resolve the version, and refuse a tag that does not match it
        # A publish is not undoable, and an npm version can never be reused, so a
        # mistyped tag would burn the number permanently.
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != 'tag' ]; then
            # A manual run releases whatever the manifest says.
            tag="$version"
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing dsh-plugin-chatgpt@$version"

      - name: Ask the registry whether this version exists yet
        id: registry
        run: |
          if npm view "dsh-plugin-chatgpt@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose the publishing credential
        # Decided from the secret itself in a shell step. setup-node exports a
        # placeholder `NODE_AUTH_TOKEN` (`XXXXX-XXXXX-XXXXX-XXXXX`) once `registry-url`
        # is set, so a condition that reads the environment cannot tell a real secret
        # from that placeholder.
        id: credential
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Publishing with the repository's NPM_TOKEN secret."
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN secret is set; publishing through npm trusted publishing."
          fi

      - name: Publish with the repository's npm token
        if: steps.registry.outputs.published == 'false' && steps.credential.outputs.mode == 'token'
        env:
          # Stated here because setup-node's placeholder would otherwise win.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish through npm trusted publishing
        # No secret: npm exchanges the id-token for a credential scoped to this
        # workflow. Trusted publishing has to be configured for this repository on
        # npmjs.com before the first run.
        #
        # npm prefers a configured token over the OIDC exchange, and setup-node's
        # `.npmrc` points `_authToken` at the placeholder, so this step runs against
        # an empty config: with no token to send, npm performs the exchange.
        if: steps.registry.outputs.published == 'false' && steps.credential.outputs.mode == 'trusted'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-publishing.npmrc
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --provenance

      - name: Record a version that was published by hand
        if: steps.registry.outputs.published == 'true'
        run: |
          echo "dsh-plugin-chatgpt@$VERSION is already on the registry." >> "$GITHUB_STEP_SUMMARY"
          echo "This run records its GitHub Release and publishes nothing." >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the tarball the Release carries
        # The asset keeps a version-free name so `releases/latest/download/…` is a
        # stable address for the current build, as the install notes promise.
        run: |
          npm pack
          mv dsh-plugin-chatgpt-*.tgz dsh-plugin-chatgpt.tgz

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dsh-plugin-chatgpt.tgz --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              dsh-plugin-chatgpt.tgz
          fi

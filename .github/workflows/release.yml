name: release

on:
  push:
    tags: ['v*']
  # Manual retries must select the existing version tag as their workflow ref.
  # A branch run cannot create or move a release tag.
  workflow_dispatch:

permissions:
  contents: read

# Version/channel reconciliation is serialized, including manual retries.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag_object: ${{ steps.source.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.1'
      - name: Admit the exact tag and reviewed main source
        id: source
        run: node scripts/release.mjs source

  web-host:
    needs: source
    uses: ./.github/workflows/web-host.yml

  release:
    needs: [source, web-host]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG_OBJECT: ${{ needs.source.outputs.tag_object }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set isolated release paths
        run: |
          printf 'RELEASE_DIRECTORY=%s/chatgpt-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'NPM_CONFIG_USERCONFIG=%s/public-registry.npmrc\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/public-registry.npmrc"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.1'
      - name: Install the fixed trusted-publishing toolchain
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          npm install --global npm@12.2.1 --ignore-scripts --registry=https://registry.npmjs.org
          node --version
          npm --version
      - run: npm ci --ignore-scripts
      - name: Checkout pinned DSH contract sources
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d743267388641bc76f17c45ce8b4c231aed1d32c
          path: .harness-contract
          persist-credentials: false
          sparse-checkout: |
            packages/llm/llm/src
            packages/util/brand/src
            packages/util/values/src
            packages/util/crypto/src
      - name: Unit tests
        run: npm test
      - name: Real DSH stream and replay contract
        run: npm run verify:harness -- .harness-contract
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Browser bundle honours the loader contract
        run: npm run verify:client
      - name: README pair is aligned
        run: npm run check:i18n
      - name: Pack the source candidate exactly once
        run: node scripts/release.mjs pack "$RELEASE_DIRECTORY"
      - name: Verify the actual candidate archive
        run: npm run verify:package -- "$RELEASE_DIRECTORY/candidate.tgz"
      - name: Install that candidate with actual host peers
        run: npm run verify:install -- "$RELEASE_DIRECTORY/candidate.tgz"
      - name: Refuse an existing conflicting GitHub Release before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs check-github "$RELEASE_DIRECTORY"
      - name: Choose the publishing credential
        id: credential
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'mode=token' >> "$GITHUB_OUTPUT"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/token-publishing.npmrc"
          else
            echo 'mode=trusted' >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/trusted-publishing.npmrc"
          fi
      - name: Publish or reconcile the exact candidate with an npm token
        if: steps.credential.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/token-publishing.npmrc
        run: node scripts/release.mjs publish "$RELEASE_DIRECTORY"
      - name: Publish or reconcile the exact candidate through trusted publishing
        if: steps.credential.outputs.mode == 'trusted'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-publishing.npmrc
          NODE_AUTH_TOKEN: ''
        run: node scripts/release.mjs publish "$RELEASE_DIRECTORY"
      - name: Install the verified archive fetched from the public registry
        run: npm run verify:install -- "$RELEASE_DIRECTORY/registry/dsh-plugin-chatgpt.tgz"
      - name: Promote the verified version to its explicit channel with an npm token
        if: steps.credential.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/token-publishing.npmrc
        run: node scripts/release.mjs promote "$RELEASE_DIRECTORY"
      - name: Promote the verified version to its explicit channel through trusted publishing
        if: steps.credential.outputs.mode == 'trusted'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-publishing.npmrc
          NODE_AUTH_TOKEN: ''
        run: node scripts/release.mjs promote "$RELEASE_DIRECTORY"
      - name: Record the GitHub Release with the verified registry bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs github "$RELEASE_DIRECTORY"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin needs a Node with native TypeScript support, since the tests
        # run the sources directly with no build step.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - name: Checkout pinned DSH contract sources
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d743267388641bc76f17c45ce8b4c231aed1d32c
          path: .harness-contract
          persist-credentials: false
          sparse-checkout: |
            packages/llm/llm/src
            packages/util/brand/src
            packages/util/values/src
            packages/util/crypto/src
      - name: Unit tests
        run: npm test
      - name: Real DSH stream and replay contract
        run: npm run verify:harness -- .harness-contract
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Browser bundle honours the loader contract
        run: npm run verify:client
      - name: Published package would load
        run: npm run verify:package
      - name: README pair is aligned
        run: npm run check:i18n
